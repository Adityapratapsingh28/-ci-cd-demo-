apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-app
  template:
    metadata:
      labels:
        app: hospital-app
    spec:
      containers:
      - name: hospital-app
        image: bella38/hospital-app:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-app-svc
spec:
  type: NodePort
  selector:
    app: hospital-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30082
