# The service that decides which environment gets traffic.
# The whole blue-green switch is just changing this selector.
apiVersion: v1
kind: Service
metadata:
  name: bg-app-svc
spec:
  type: NodePort
  selector:
    app: bg-app
    version: blue     # <-- THIS LINE IS THE SWITCH (blue or green)
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30081
