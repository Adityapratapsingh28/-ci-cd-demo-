# Green deployment - the new version, deployed but NOT receiving traffic yet
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bg-app-green
  labels:
    app: bg-app
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-app
      version: green
  template:
    metadata:
      labels:
        app: bg-app
        version: green
    spec:
      containers:
      - name: bg-app
        image: bella38/bg-demo:green
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"
