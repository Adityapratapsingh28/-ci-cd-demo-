<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Demo App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .card {
      text-align: center;
      padding: 3rem;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .version { font-size: 1.2rem; opacity: 0.9; margin: 1rem 0; }
    .badge {
      display: inline-block;
      padding: 0.5rem 1.2rem;
      background: #4ade80;
      color: #052e16;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    small { display: block; margin-top: 2rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 CI/CD Demo</h1>
    <p class="version">Version 1.0</p>
    <span class="badge">Deployed via Jenkins → Kubernetes</span>
    <small>Build: DEVOPS-DEMO</small>
  </div>
</body>
</html>
